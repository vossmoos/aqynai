{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aqyn.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aqyn.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "aqyn.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aqyn.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: aqyn-api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.api.service.port }}
        env:
        - name: POSTGRES_HOST
          value: {{ include "aqyn.fullname" . }}-postgres-service
        envFrom:
        - configMapRef:
            name: {{ include "aqyn.fullname" . }}-config
        {{- with .Values.api.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}