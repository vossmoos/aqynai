{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aqyn.fullname" . }}-postgres-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aqyn.postgres.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}
  ports:
  - port: {{ .Values.postgres.service.port }}
    targetPort: {{ .Values.postgres.service.port }}
    protocol: TCP
    name: postgres
  selector:
    {{- include "aqyn.postgres.selectorLabels" . | nindent 4 }}
{{- end }}