apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aqyn.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aqyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}