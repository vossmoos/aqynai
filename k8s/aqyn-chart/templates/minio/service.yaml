{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aqyn.fullname" . }}-minio-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aqyn.minio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.minio.service.type }}
  ports:
  - name: api
    port: {{ .Values.minio.service.apiPort }}
    targetPort: {{ .Values.minio.service.apiPort }}
    protocol: TCP
  - name: console
    port: {{ .Values.minio.service.consolePort }}
    targetPort: {{ .Values.minio.service.consolePort }}
    protocol: TCP
  selector:
    {{- include "aqyn.minio.selectorLabels" . | nindent 4 }}
{{- end }}